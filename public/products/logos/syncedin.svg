<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="nexus-fav-grad" x1="2" y1="8" x2="30" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6366F1" />
      <stop offset="50%" stopColor="#8B5CF6" />
      <stop offset="100%" stopColor="#7C3AED" />
    </linearGradient>
    <filter id="nexus-fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" floodColor="#7C3AED" floodOpacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Track: Bold, full canvas width & height for maximum tab bar legibility -->
  <path
    d="M 16 16 C 19.5 25, 27 25, 29 16 C 31 7, 23.5 7, 16 16 C 8.5 25, 1 25, 3 16 C 5 7, 12.5 7, 16 16 Z"
    stroke="url(#nexus-fav-grad)"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#nexus-fav-glow)"
  />

  <!-- Inner Track: Concentric parallel path -->
  <path
    d="M 16 16 C 18.5 22, 24 22, 25.5 16 C 27 10, 21.5 10, 16 16 C 10.5 22, 5 22, 6.5 16 C 8 10, 13.5 10, 16 16 Z"
    stroke="url(#nexus-fav-grad)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>